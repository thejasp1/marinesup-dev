name: Toon Remote v1.4 Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Toon Remote branch
        uses: actions/checkout@v4
        with:
          ref: toon-remote-apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: toon-remote
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp toon-remote/app/build/outputs/apk/debug/app-debug.apk ToonRemote-WFA-Wilbrink-Enterprise-v1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToonRemote-WFA-Wilbrink-Enterprise-v1.4
          path: ToonRemote-WFA-Wilbrink-Enterprise-v1.4.apk
          if-no-files-found: error
