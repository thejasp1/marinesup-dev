name: Build Toon Remote APK

on:
  push:
    branches: [toon-remote-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: toon-remote
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp toon-remote/app/build/outputs/apk/debug/app-debug.apk ToonRemote-WFA-Wilbrink-Enterprise-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ToonRemote-WFA-Wilbrink-Enterprise-v1.1
          path: ToonRemote-WFA-Wilbrink-Enterprise-v1.1.apk
          if-no-files-found: error
