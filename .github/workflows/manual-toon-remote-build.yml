name: Manual Toon Remote Enterprise APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Toon Remote branch
        uses: actions/checkout@v4
        with:
          ref: toon-remote-apk
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply nullable-data compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('toon-remote/app/src/main/java/nl/wfawilbrink/toonremote/MainActivity.kt')
          s = p.read_text()
          marker = '''        if (!connected) {\n            DisconnectedCard(ip, state, onRefresh, onSetup)\n            return@Column\n        }\n'''
          replacement = marker + '''\n        val liveData = data ?: return@Column\n'''
          if 'val liveData = data ?: return@Column' not in s:
              s = s.replace(marker, replacement, 1)
          s = s.replace('data!!.heating', 'liveData.heating')
          s = s.replace('data.heating', 'liveData.heating')
          s = s.replace('data.roomTemp', 'liveData.roomTemp')
          s = s.replace('data.setpoint', 'liveData.setpoint')
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: toon-remote
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp toon-remote/app/build/outputs/apk/debug/app-debug.apk ToonRemote-WFA-Wilbrink-Enterprise-v1.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToonRemote-WFA-Wilbrink-Enterprise-v1.1
          path: ToonRemote-WFA-Wilbrink-Enterprise-v1.1.apk
          if-no-files-found: error
